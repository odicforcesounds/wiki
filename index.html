<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Launcher for the Civic Perks presentation: English-only, or multilingual with a language switcher."
    />
    <title>Civic Perks — presentation</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070c;
        --panel: #0e1521;
        --text: #eaf2ff;
        --muted: #8ba0bb;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.18);
        --neon: #35f0a0;
        --cyan: #35d5f0;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(700px 420px at 8% -10%, rgba(53, 240, 160, 0.1), transparent 65%),
          var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
      }

      .menu {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 16px 0 7px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: inherit;
        text-decoration: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .menu:hover {
        border-color: color-mix(in srgb, var(--neon) 50%, transparent);
      }

      .menu__mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: #04140d;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        font-size: 14px;
      }

      .menu__label {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .menu__hint {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 8.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .topbar__note {
        margin: 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .intro {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 28px;
        text-align: center;
      }

      .intro__mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        color: #04140d;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        font-size: 28px;
        box-shadow: 0 0 48px color-mix(in srgb, var(--neon) 30%, transparent);
      }

      .intro h1 {
        margin: 6px 0 0;
        font-size: clamp(34px, 6vw, 56px);
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .intro p {
        margin: 0;
        max-width: 48ch;
        color: var(--muted);
        font-size: 14px;
      }

      .intro strong {
        color: var(--text);
      }

      .intro__hint {
        margin-top: 4px;
        color: var(--amber, #ffb648);
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .btn-open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        color: #04140d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.01em;
        text-decoration: none;
        box-shadow: 0 10px 30px color-mix(in srgb, var(--neon) 30%, transparent);
      }

      .btn-open:active {
        transform: scale(0.98);
      }

      .btn-open--ghost {
        border: 1px solid var(--line-strong);
        background: var(--panel);
        color: var(--text);
        box-shadow: none;
      }

      .btn-open--ghost:hover {
        border-color: color-mix(in srgb, var(--neon) 50%, transparent);
      }

      .intro__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }

      @media (max-width: 640px) {
        .topbar__note {
          display: none;
        }

        .intro {
          padding: 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="menu" href="presentation.html" aria-label="Open the Civic Perks presentation">
        <span class="menu__mark" aria-hidden="true">◈</span>
        <span class="menu__label">Civic Perks</span>
        <span class="menu__hint">Presentation</span>
      </a>
      <p class="topbar__note">Single-entry container · no other navigation</p>
    </header>

    <section class="intro" id="intro" aria-labelledby="intro-title">
      <span class="intro__mark" aria-hidden="true">◈</span>
      <h1 id="intro-title">Civic Perks</h1>
      <p>
        Two versions of the same page: the <strong>English-only</strong> presentation, or the
        multilingual build with the top bar and language switcher.
      </p>
      <p class="intro__hint">Civic Perks · presentation</p>
      <div class="intro__actions">
        <a class="btn-open" href="presentation.html">
          English-only <span aria-hidden="true">↗</span>
        </a>
        <a class="btn-open btn-open--ghost" href="presentation-container.html">
          Multilingual <span aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </body>
</html>
