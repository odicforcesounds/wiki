<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Single-menu container that opens the full Civic Perks presentation."
    />
    <title>Civic Perks — presentation container</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070c;
        --panel: #0e1521;
        --text: #eaf2ff;
        --muted: #8ba0bb;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.18);
        --neon: #35f0a0;
        --cyan: #35d5f0;
        --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(700px 420px at 8% -10%, rgba(53, 240, 160, 0.1), transparent 65%),
          var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(14px);
      }

      .menu {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 16px 0 7px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: var(--panel);
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }

      .menu:hover {
        border-color: color-mix(in srgb, var(--neon) 50%, transparent);
      }

      .menu[aria-expanded="true"] {
        border-color: color-mix(in srgb, var(--neon) 65%, transparent);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--neon) 25%, transparent),
          0 8px 26px color-mix(in srgb, var(--neon) 18%, transparent);
      }

      .menu__mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: #04140d;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        font-size: 14px;
      }

      .menu__label {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .menu__hint {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 8.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .topbar__note {
        margin: 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .intro {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 28px;
        text-align: center;
      }

      .intro[hidden] {
        display: none;
      }

      .intro__mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        color: #04140d;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        font-size: 28px;
        box-shadow: 0 0 48px color-mix(in srgb, var(--neon) 30%, transparent);
      }

      .intro h1 {
        margin: 6px 0 0;
        font-size: clamp(34px, 6vw, 56px);
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .intro p {
        margin: 0;
        max-width: 48ch;
        color: var(--muted);
        font-size: 14px;
      }

      .intro strong {
        color: var(--text);
      }

      .intro__hint {
        margin-top: 4px;
        color: var(--amber, #ffb648);
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .btn-open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        margin-top: 10px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--neon), var(--cyan));
        color: #04140d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: -0.01em;
        box-shadow: 0 10px 30px color-mix(in srgb, var(--neon) 30%, transparent);
      }

      .btn-open:active {
        transform: scale(0.98);
      }

      .stage {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
        padding: 12px;
      }

      .stage[hidden] {
        display: none;
      }

      .frame {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }

      .frame__bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .frame__dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--neon);
        box-shadow: 0 0 8px var(--neon);
      }

      .frame iframe {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: 0;
        background: var(--bg);
      }

      @media (max-width: 640px) {
        .topbar__note {
          display: none;
        }

        .stage {
          padding: 6px;
        }

        .frame {
          border-radius: 12px;
        }

        .intro {
          padding: 20px;
        }

        /* On phones the presentation takes the whole viewport. The single
           Civic Perks bar stays on top so there is always a way back. */
        body.is-open .topbar {
          position: fixed;
          top: 0;
          right: 0;
          left: 0;
          z-index: 30;
          padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
          background: color-mix(in srgb, var(--bg) 95%, transparent);
        }

        body.is-open .intro {
          display: none;
        }

        body.is-open .stage {
          position: fixed;
          inset: 0;
          z-index: 20;
          padding: calc(60px + env(safe-area-inset-top)) 0 0;
        }

        body.is-open .frame {
          border: 0;
          border-radius: 0;
          box-shadow: none;
          background: var(--bg);
        }

        body.is-open .frame__bar {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <button
        class="menu"
        id="cp-menu"
        type="button"
        aria-expanded="false"
        aria-controls="stage"
        aria-label="Civic Perks presentation menu"
      >
        <span class="menu__mark" aria-hidden="true">◈</span>
        <span class="menu__label">Civic Perks</span>
        <span class="menu__hint">Presentation</span>
      </button>
      <p class="topbar__note">Single-entry container · no other navigation</p>
    </header>

    <section class="intro" id="intro" aria-labelledby="intro-title">
      <span class="intro__mark" aria-hidden="true">◈</span>
      <h1 id="intro-title">Civic Perks</h1>
      <p>
        Click the <strong>Civic Perks</strong> menu in the top-left to open the full presentation
        inside this container.
      </p>
      <p class="intro__hint">Civic Perks · presentation</p>
      <button class="btn-open" id="open-presentation" type="button" aria-controls="stage">
        Open presentation <span aria-hidden="true">↗</span>
      </button>
    </section>

    <main class="stage" id="stage" hidden>
      <div class="frame">
        <div class="frame__bar">
          <span class="frame__dot" aria-hidden="true"></span>
          Civic Perks presentation · civic-perks.org
        </div>
        <iframe
          id="cp-frame"
          title="Civic Perks presentation"
          data-src="presentation.html"
          allow="fullscreen"
        ></iframe>
      </div>
    </main>

    <script>
      (function () {
        var menu = document.getElementById("cp-menu");
        var stage = document.getElementById("stage");
        var intro = document.getElementById("intro");
        var frame = document.getElementById("cp-frame");
        var cta = document.getElementById("open-presentation");
        var loaded = false;

        function open() {
          if (!loaded) {
            frame.src = frame.getAttribute("data-src");
            loaded = true;
          }
          document.body.classList.add("is-open");
          stage.hidden = false;
          intro.hidden = true;
          menu.setAttribute("aria-expanded", "true");
          frame.focus();
        }

        function close() {
          document.body.classList.remove("is-open");
          stage.hidden = true;
          intro.hidden = false;
          menu.setAttribute("aria-expanded", "false");
          menu.focus();
        }

        menu.addEventListener("click", function () {
          if (stage.hidden) open();
          else close();
        });

        if (cta) cta.addEventListener("click", open);
      })();
    </script>
  </body>
</html>
